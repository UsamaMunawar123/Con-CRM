<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Construction CRM 1.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  /* base surfaces — light purple / white */
  --bg:#f5f2ff;
  --bg-2:#ede8fb;
  --surface:#ffffff;
  --surface-2:#f5f2ff;
  --surface-3:#ebe5fb;
  --raised:#ffffff;
  /* borders */
  --line:#ddd5f8;
  --line-2:#c4b5f5;
  --line-soft:#e8e1fb;
  /* text */
  --text:#1e1040;
  --text-2:#4a3d7a;
  --text-3:#7b6fa8;
  --text-4:#a99abe;
  /* accent — purple */
  --accent:#7c3aed;
  --accent-2:#6d28d9;
  --accent-soft:rgba(124,58,237,.1);
  --accent-line:rgba(124,58,237,.32);
  /* status */
  --open:#059669;        --open-bg:rgba(5,150,105,.1);      --open-line:rgba(5,150,105,.3);
  --booked:#d97706;      --booked-bg:rgba(217,119,6,.1);    --booked-line:rgba(217,119,6,.3);
  --token:#7c3aed;       --token-bg:rgba(124,58,237,.1);    --token-line:rgba(124,58,237,.3);
  --sold:#dc2626;        --sold-bg:rgba(220,38,38,.1);      --sold-line:rgba(220,38,38,.3);
  --blocked:#6b7280;     --blocked-bg:rgba(107,114,128,.1); --blocked-line:rgba(107,114,128,.3);
  /* fonts */
  --f-display:'Space Grotesk',system-ui,sans-serif;
  --f-ui:'IBM Plex Sans',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
  /* radius */
  --r-sm:7px; --r:10px; --r-lg:14px; --r-xl:20px;
  --shadow:0 1px 3px rgba(109,40,217,.06),0 6px 18px rgba(109,40,217,.08);
  --shadow-lg:0 12px 40px rgba(109,40,217,.14),0 24px 60px rgba(109,40,217,.08);
  --nav-w:248px;
  --nav-w-compact:76px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--f-ui);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
#root{height:100vh;overflow:hidden;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:20px;border:2px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--accent-line);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;}
a{color:inherit;text-decoration:none;}

/* utility animations */
@keyframes fadeUp{from{transform:translateY(10px);}to{transform:none;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes popIn{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:none;}}
@keyframes slideIn{from{opacity:0;transform:translateX(14px);}to{opacity:1;transform:none;}}
@keyframes sheetIn{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:none;}}
.fade-up{animation:fadeUp .45s cubic-bezier(.16,1,.3,1);}
.fade-in{animation:fadeIn .3s ease;}

/* focus */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* selection */
::selection{background:var(--accent-soft);color:#fff;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script type="text/babel" src="app.jsx"></script>
</body>
